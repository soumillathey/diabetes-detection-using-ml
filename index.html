<!DOCTYPE html>
<html>
  <head>
    <title>Diabetes Prediction</title>
    <link rel="icon" href="icon.gif" type="image/gif" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="model_data.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Diabetes Prediction Model</h1>
      <p>Enter the following features to predict Diabetes:</p>
      <form id="predictionForm" class="form">
        <label for="feature1">Pregnancies</label>
        <input
          class="input"
          type="number"
          id="feature1"
          name="feature1"
          placeholder="0 to 17"
        />
        <label for="feature2">Glucose</label>
        <input
          class="input"
          type="number"
          id="feature2"
          name="feature2"
          placeholder="0 to 199 mg/dL"
        />
        <label for="feature3">Blood Pressure</label>
        <input
          class="input"
          type="number"
          id="feature3"
          name="feature3"
          placeholder="0 to 122 mm Hg"
        />
        <label for="feature4">Skin Thickness</label>
        <input
          class="input"
          type="float"
          id="feature4"
          name="feature4"
          placeholder="0 to 99 mm"
        />
        <label for="feature5">Insulin</label>
        <input
          class="input"
          type="float"
          id="feature5"
          name="feature5"
          placeholder="0 to 846 μU/mL"
        />
        <label for="feature6">BMI</label>
        <input
          class="input"
          type="float"
          id="feature6"
          name="feature6"
          placeholder="0 to 67.1 kg/m²"
        />
        <label for="feature7">Diabetes Pedigree Function</label>
        <input
          class="input"
          type="float"
          id="feature7"
          name="feature7"
          placeholder="0.078 to 2.42"
        />
        <label for="feature8">Age</label>
        <input
          type="number"
          class="input"
          id="feature8"
          name="feature8"
          placeholder="21 to 81 years"
        />
        <div class="loader" id="loader"></div>
        <p id="result"></p>
        <button type="submit" class="login-button">Predict</button>
      </form>
    </div>
    <script>
      function predictLocally(features) {
        if (typeof MODEL_DATA === "undefined" || !MODEL_DATA.trees) return null;
        let allVals = [];
        for (let tree of MODEL_DATA.trees) {
          let node = 0;
          while (tree.left[node] !== -1) {
            let feat = tree.feature[node];
            let thresh = tree.threshold[node];
            if (features[feat] <= thresh) {
              node = tree.left[node];
            } else {
              node = tree.right[node];
            }
          }
          allVals.push(tree.value[node]);
        }
        let c0 = 0, c1 = 0;
        for (let v of allVals) {
          c0 += v[0];
          c1 += v[1];
        }
        let prob1 = c1 / (c0 + c1);
        let pct = Math.round(prob1 * 1000) / 10;
        return {
          prediction: prob1 >= 0.5 ? 1 : 0,
          probability: pct,
          risk_level: pct >= 60 ? "High Risk" : (pct >= 35 ? "Moderate Risk" : "Low Risk")
        };
      }

      function displayPrediction(data) {
        const isPositive = data.prediction === 1;
        const prob = data.probability !== undefined ? data.probability : (isPositive ? 80 : 20);
        const risk = data.risk_level || (isPositive ? "High Risk" : "Low Risk");
        const color = isPositive ? "#d9534f" : "#28a745";
        const bgColor = isPositive ? "#fdf2f2" : "#f2f9f4";
        const borderColor = isPositive ? "#f5c6cb" : "#c3e6cb";

        document.getElementById("result").innerHTML = `
          <div style="background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center;">
            <div style="color: ${color}; font-size: 19px; font-weight: bold; margin-bottom: 6px;">
              ${isPositive ? "⚠️ Likely to Have Diabetes" : "✅ Unlikely to Have Diabetes"}
            </div>
            <div style="color: #333; font-size: 15px; margin-bottom: 4px;">
              Risk Assessment: <strong>${risk}</strong>
            </div>
            <div style="color: #555; font-size: 15px;">
              Estimated Probability: <strong style="color: ${color}; font-size: 18px;">${prob}%</strong>
            </div>
          </div>
        `;
      }

      document
        .getElementById("predictionForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const features = [
            parseFloat(document.getElementById("feature1").value),
            parseFloat(document.getElementById("feature2").value),
            parseFloat(document.getElementById("feature3").value),
            parseFloat(document.getElementById("feature4").value),
            parseFloat(document.getElementById("feature5").value),
            parseFloat(document.getElementById("feature6").value),
            parseFloat(document.getElementById("feature7").value),
            parseFloat(document.getElementById("feature8").value),
          ];

          // Show loader
          document.getElementById("loader").style.display = "block";
          document.getElementById("result").innerText = "";

          // If deployed on GitHub Pages, use client-side model immediately
          if (window.location.hostname.endsWith("github.io")) {
            const localResult = predictLocally(features);
            if (localResult) {
              displayPrediction(localResult);
              document.getElementById("loader").style.display = "none";
              return;
            }
          }

          const apiUrl = window.location.protocol.startsWith("http")
            ? "/predict"
            : "http://localhost:5001/predict";

          fetch(
            apiUrl,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ features }),
            }
          )
            .then((response) => {
              if (!response.ok) throw new Error("HTTP error " + response.status);
              return response.json();
            })
            .then((data) => {
              displayPrediction(data);
            })
            .catch((error) => {
              console.warn("Backend unavailable, using client-side model fallback:", error);
              const localResult = predictLocally(features);
              if (localResult) {
                displayPrediction(localResult);
              } else {
                document.getElementById("result").innerText =
                  "An error occurred. Please try again.";
              }
            })
            .finally(() => {
              document.getElementById("loader").style.display = "none";
            });
        });
    </script>
  </body>
</html>
